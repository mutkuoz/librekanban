# Local development: just Postgres. Run the app on the host with `pnpm dev`.
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: librekanban
      POSTGRES_PASSWORD: librekanban
      POSTGRES_DB: librekanban
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U librekanban -d librekanban']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
